[package]
name = "roblox-account-manager-rs"
version = "0.1.3"
edition = "2024"

[dependencies]
aes-gcm = { version = "0.11.1", features = ["getrandom"] }
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.36"
egui_extras = { version = "0.36.2", features = ["http", "image"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
open = "5.4.4"
raw-window-handle = "0.6"
regex = "1.13.1"
arboard = { version = "3.6", default-features = false }
rfd = { version = "0.17", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tao = "0.37"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
windows-registry = "0.6"
wry = "0.57"
zip = "8.6.0"

[build-dependencies]
winresource = "0.1.31"

